<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Trip - Trip Expense Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
                <i class="fas fa-plane-departure text-warning"></i>
                <span>TripSplitter</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white fw-semibold">
                    <i class="fas fa-user-circle text-warning me-1"></i><span id="nav-user-name">User</span>
                </span>
                <button id="logout-btn" class="btn btn-outline-light btn-sm px-3 rounded-pill">
                    <i class="fas fa-sign-out-alt me-1"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Create Trip Form Container -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
                    <div class="d-flex align-items-center mb-4">
                        <a href="dashboard.html" class="btn btn-outline-secondary btn-sm me-3">
                            <i class="fas fa-arrow-left me-1"></i>Back
                        </a>
                        <h3 class="fw-bold mb-0"><i class="fas fa-route text-primary me-2"></i>Create New Trip</h3>
                    </div>

                    <form id="create-trip-form">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Trip Name *</label>
                                <input type="text" id="trip_name" class="form-control" placeholder="e.g. Paris Europe Tour, Switzerland Vacation" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Destination *</label>
                                <input type="text" id="destination" class="form-control" placeholder="e.g. Paris, Switzerland, Goa, Varanasi" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Start Date *</label>
                                <input type="date" id="start_date" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">End Date *</label>
                                <input type="date" id="end_date" class="form-control" required>
                            </div>
                        </div>

                        <!-- Attractive Destination Image / Theme Selector -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="fas fa-images text-warning me-2"></i>Select Trip Destination Cover Photo *</label>
                            <input type="hidden" id="selected_image_url" value="images/paris.jpg">
                            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3" id="theme-selector-container">
                                <!-- Option 1: Paris -->
                                <div class="col">
                                    <div class="trip-theme-card selected" data-img="images/paris.jpg">
                                        <img src="images/paris.jpg" class="trip-theme-img" alt="Paris">
                                        <span class="trip-theme-badge">France</span>
                                        <div class="p-2 text-center small fw-bold text-dark">🗼 Paris</div>
                                    </div>
                                </div>
                                <!-- Option 2: Switzerland -->
                                <div class="col">
                                    <div class="trip-theme-card" data-img="images/switzerland.jpg">
                                        <img src="images/switzerland.jpg" class="trip-theme-img" alt="Switzerland">
                                        <span class="trip-theme-badge">Alps</span>
                                        <div class="p-2 text-center small fw-bold text-dark">🇨🇭 Switzerland</div>
                                    </div>
                                </div>
                                <!-- Option 3: Holy Places -->
                                <div class="col">
                                    <div class="trip-theme-card" data-img="images/holy_places.jpg">
                                        <img src="images/holy_places.jpg" class="trip-theme-img" alt="Holy Places">
                                        <span class="trip-theme-badge">Pilgrimage</span>
                                        <div class="p-2 text-center small fw-bold text-dark">🛕 Holy Places</div>
                                    </div>
                                </div>
                                <!-- Option 4: Beach -->
                                <div class="col">
                                    <div class="trip-theme-card" data-img="images/beach.jpg">
                                        <img src="images/beach.jpg" class="trip-theme-img" alt="Beach">
                                        <span class="trip-theme-badge">Goa/Bali</span>
                                        <div class="p-2 text-center small fw-bold text-dark">🏖️ Tropical Beach</div>
                                    </div>
                                </div>
                                <!-- Option 5: Mountains -->
                                <div class="col">
                                    <div class="trip-theme-card" data-img="images/mountains.jpg">
                                        <img src="images/mountains.jpg" class="trip-theme-img" alt="Mountains">
                                        <span class="trip-theme-badge">Manali</span>
                                        <div class="p-2 text-center small fw-bold text-dark">🏔️ Mountains</div>
                                    </div>
                                </div>
                                <!-- Option 6: Desert -->
                                <div class="col">
                                    <div class="trip-theme-card" data-img="images/desert.jpg">
                                        <img src="images/desert.jpg" class="trip-theme-img" alt="Desert">
                                        <span class="trip-theme-badge">Rajasthan</span>
                                        <div class="p-2 text-center small fw-bold text-dark">🏜️ Desert Safari</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea id="description" class="form-control" rows="3" placeholder="Brief notes or description about the trip..."></textarea>
                        </div>

                        <!-- Trip Members Section -->
                        <div class="mb-4 p-3 bg-light rounded border">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <h6 class="fw-bold mb-0"><i class="fas fa-users text-info me-2"></i>Trip Members</h6>
                                    <small class="text-muted">You are automatically added as the trip creator.</small>
                                </div>
                                <button type="button" id="add-member-input-btn" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-user-plus me-1"></i>+ Add Member
                                </button>
                            </div>
                            <div id="member-inputs-container">
                                <!-- Dynamic member rows appended here -->
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="dashboard.html" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4">
                                <i class="fas fa-check-circle me-1"></i>Create Trip
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/trips.js"></script>
</body>
</html>
