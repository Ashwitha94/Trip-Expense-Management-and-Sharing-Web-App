<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Trip Expense Management</title>
    <script>
        // Redirect to trip-details page with expenses tab active
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('id');
        if (tripId) {
            window.location.href = `trip-details.html?id=${tripId}#expenses-pane`;
        } else {
            window.location.href = 'dashboard.html';
        }
    </script>
</head>

</body>
</html>
