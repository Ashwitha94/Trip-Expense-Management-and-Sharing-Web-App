<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Trip Expense Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <i class="fas fa-plane-departure text-warning"></i>
                <span>TripSplitter</span>
            </a>
        </div>
    </nav>

    <!-- Register Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card card-custom shadow-lg border-0 overflow-hidden">
                    <div class="row g-0">
                        <!-- Left Column: Switzerland Photo Banner -->
                        <div class="col-md-5 d-none d-md-block position-relative" style="background-image: url('images/switzerland.jpg'); background-size: cover; background-position: center; min-height: 520px;">
                            <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-end p-4 text-white" style="background: linear-gradient(to top, rgba(15,23,42,0.9), transparent);">
                                <span class="badge bg-primary text-white fw-bold w-auto align-self-start mb-2"><i class="fas fa-mountain me-1"></i>Swiss Alps Vacation</span>
                                <h3 class="fw-bold mb-1">Start Splitting Bills</h3>
                                <p class="small text-light opacity-75 mb-0">Create trips for Paris, Switzerland, Beaches & Holy Pilgrimages with friends.</p>
                            </div>
                        </div>

                        <!-- Right Column: Register Form -->
                        <div class="col-md-7 p-4 p-md-5 bg-white">
                            <div class="text-center mb-4">
                                <div class="avatar bg-success text-white rounded-circle mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 55px; height: 55px;">
                                    <i class="fas fa-user-plus fa-1x"></i>
                                </div>
                                <h3 class="fw-bold">Create an Account</h3>
                                <p class="text-muted small">Start tracking and splitting trip costs with friends</p>
                            </div>

                            <form id="register-form">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                                        <input type="text" id="name" class="form-control" placeholder="Ashwitha Maragoni" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                                        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                                    </div>
                                </div>

                                <div class="row g-2 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Confirm Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="fas fa-check-double text-muted"></i></span>
                                            <input type="password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                                    <i class="fas fa-user-check me-2"></i>Create Account
                                </button>
                            </form>

                            <div class="text-center">
                                <p class="text-muted small mb-0">Already have an account? <a href="login.html" class="fw-bold text-primary text-decoration-none">Login here</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
